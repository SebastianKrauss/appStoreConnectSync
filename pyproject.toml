[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ascsync"
version = "0.1.0"
description = "App Store Connect content as code — pull, diff, review, push"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Sebastian Fischer" }]
keywords = ["app-store-connect", "ios", "appstore", "content-as-code", "asc"]
dependencies = ["pyjwt[crypto]>=2.6", "requests>=2.28"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
rrule = ["python-dateutil>=2.8"]

[project.scripts]
ascsync = "ascsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
